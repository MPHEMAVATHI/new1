services:
  lung-cancer-ai:
    build: .
    image: lung-cancer-ai:latest
    container_name: lung-cancer-ai
    ports:
      - "8501:8501"
    volumes:
      # Mount model weights and research data from the host so large files
      # never need to be baked into the image.
      - ./models:/app/models
      - ./data:/app/data
      - ./configs:/app/configs
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
